<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Die 50-30-20-Regel</title><desc id="desc">Beispiel bei 2500 Euro netto: 1250 Euro Grundbedarf, 750 Euro Wünsche, 500 Euro Rücklagen.</desc><rect width="900" height="390" rx="20" fill="#f6faf5"/><text x="40" y="54" fill="#123d31" font-family="Arial,sans-serif" font-size="23" font-weight="700">Beispiel: 2.500 € Nettoeinkommen</text><text x="40" y="84" fill="#64786d" font-family="Arial,sans-serif" font-size="16">So könnte sich dein Monatsbudget verteilen.</text><rect x="40" y="110" width="820" height="36" rx="12" fill="#e5ede6"/><path d="M52 110 H450 V146 H52 Q40 146 40 134 V122 Q40 110 52 110Z" fill="#206848"/><rect x="450" y="110" width="246" height="36" fill="#ddb14b"/><path d="M696 110 H848 Q860 110 860 122 V134 Q860 146 848 146 H696 Z" fill="#9cc8a8"/><rect x="40" y="174" width="260" height="174" rx="16" fill="#ffffff" stroke="#dce8df"/><text x="60" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#206848">50 % · Grundbedarf</text><text x="60" y="259" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123d31">1.250 €</text><text x="60" y="299" font-family="Arial,sans-serif" font-size="15" fill="#61796c">Miete, Lebensmittel</text><text x="60" y="323" font-family="Arial,sans-serif" font-size="15" fill="#61796c">und notwendige Kosten</text><rect x="320" y="174" width="260" height="174" rx="16" fill="#ffffff" stroke="#dce8df"/><text x="340" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#b18727">30 % · Wünsche</text><text x="340" y="259" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123d31">750 €</text><text x="340" y="299" font-family="Arial,sans-serif" font-size="15" fill="#61796c">Freizeit, Urlaub</text><text x="340" y="323" font-family="Arial,sans-serif" font-size="15" fill="#61796c">und Spaßgeld</text><rect x="600" y="174" width="260" height="174" rx="16" fill="#ffffff" stroke="#dce8df"/><text x="620" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#3b8463">20 % · Rücklagen</text><text x="620" y="259" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#123d31">500 €</text><text x="620" y="299" font-family="Arial,sans-serif" font-size="15" fill="#61796c">Notgroschen</text><text x="620" y="323" font-family="Arial,sans-serif" font-size="15" fill="#61796c">und Sparziele</text></svg>